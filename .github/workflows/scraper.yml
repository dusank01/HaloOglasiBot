name: Halo Oglasi Scraper

on:
  schedule:
    # Pokreće se na svakih 30 minuta od 04:00 do 22:00 UTC (~06:00 do 24:00 lokalno)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Preuzmi kod repozitorijuma
        uses: actions/checkout@v4

      - name: Podesi Python okruženje
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 python-dotenv

      - name: Pokreni skrejper
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py

      - name: Sačuvaj osveženi seen_ads.json nazad na GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f seen_ads.json
          git commit -m "Automatsko osvežavanje baze viđenih oglasa [skip ci]" || exit 0
          git push